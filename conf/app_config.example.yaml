# 应用配置示例模板
# 使用方法：复制为 conf/app_config.yaml 后填入本地真实值。
# conf/app_config.yaml 已被 .gitignore 忽略，请勿提交真实凭据。

# 日志配置
logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 数据库meta的配置
db_meta:
  host: localhost
  port: 3306
  user: your_mysql_user
  password: your_mysql_password
  database: meta

# 数据库dw的配置
db_dw:
  host: localhost
  port: 3306
  user: your_mysql_user
  password: your_mysql_password
  database: dw

# qdrant的配置
qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

# embedding的配置
embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

# es的配置
es:
  host: localhost
  port: 9200
  index_name: data_agent

# llm的配置
llm:
  model_name: deepseek-chat
  api_key: your_llm_api_key
