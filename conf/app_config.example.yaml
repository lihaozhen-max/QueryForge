# 应用配置示例模板
# 使用方法：复制为 conf/app_config.yaml 后按需修改。
# conf/app_config.yaml 已被 .gitignore 忽略，请勿提交真实凭据。
#
# 凭据类配置一律通过环境变量提供，不出现在配置文件里。
# 语法为 ${oc.env:变量名}（必填，缺失则启动报错）或 ${oc.env:变量名,默认值}（可选，带默认值）

# 日志配置
logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 数据库meta的配置（存放表/字段/指标等元数据）
# 连接信息可用环境变量覆盖: DB_META_HOST / DB_META_PORT / DB_META_DATABASE
db_meta:
  host: ${oc.env:DB_META_HOST,localhost}
  port: ${oc.env:DB_META_PORT,3306}
  user: ${oc.env:DB_META_USER,root}
  # 必填环境变量: DB_META_PASSWORD
  password: ${oc.env:DB_META_PASSWORD}
  database: ${oc.env:DB_META_DATABASE,meta}

# 数据库dw的配置（业务数仓，SQL 实际执行的位置）
# 连接信息可用环境变量覆盖: DB_DW_HOST / DB_DW_PORT / DB_DW_DATABASE
db_dw:
  host: ${oc.env:DB_DW_HOST,localhost}
  port: ${oc.env:DB_DW_PORT,3306}
  user: ${oc.env:DB_DW_USER,root}
  # 必填环境变量: DB_DW_PASSWORD
  password: ${oc.env:DB_DW_PASSWORD}
  database: ${oc.env:DB_DW_DATABASE,dw}

# qdrant的配置
qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

# embedding的配置
embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

# es的配置
es:
  host: localhost
  port: 9200
  index_name: data_agent

# llm的配置
#
# 两个用途：
#   1) 本地跑**微调后的 Qwen3-8B**（推荐，本项目最终形态）：
#        $env:LLM_PROVIDER   = 'openai_compatible'
#        $env:LLM_BASE_URL   = 'http://127.0.0.1:8000/v1'   # 或隧道映射出来的地址
#        $env:LLM_MODEL_NAME = 'qwen3-8b-lora'
#        $env:LLM_API_KEY    = 'EMPTY'                       # 本地端点不校验 key
#   2) 用 DeepSeek 云端做对照：
#        $env:LLM_BASE_URL   = 'https://api.deepseek.com/v1'
#        $env:LLM_MODEL_NAME = 'deepseek-flash'
#        $env:LLM_API_KEY    = '<你的真实 key>'
#
# 四个环境变量都能覆盖；api_key 不写进文件，避免再次把密钥提交进仓库。
llm:
  provider: ${oc.env:LLM_PROVIDER,openai_compatible}
  model_name: ${oc.env:LLM_MODEL_NAME,deepseek-chat}
  api_key: ${oc.env:LLM_API_KEY,''}
  base_url: ${oc.env:LLM_BASE_URL,''}
